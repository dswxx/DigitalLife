<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数字生命 · AI 数字人</title>
    <script>
      try {
        var savedTheme = localStorage.getItem('digitallife.theme')
        if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme)
      } catch (e) {
        /* 隐私模式下 localStorage 可能不可用，忽略即可 */
      }
    </script>
    <!-- 整个占位值由服务端替换，HTML 禁止缓存。 -->
    <script>
      window.__DL_BOOT__ = /*__DL_BOOT__*/null;
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
