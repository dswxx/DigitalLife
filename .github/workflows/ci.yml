name: 自测

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # 无需模型账户或真实聊天；各 Python 版本只运行合成数据的核心与协议检查。
  backend:
    name: 后端（Python ${{ matrix.python }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 装依赖
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: 单元与文档回归
        run: python scripts/check.py --unit

  end-to-end:
    # 应用和假上游通过真实本机 socket 互通，检验流式传输而非外部模型可用性。
    name: 端到端（真起服务 + 真流式）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 装依赖
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: 假上游 + 数字生命后端，走真 socket
        run: python tests/test_http.py

  frontend:
    # Vite 仅转译，必须单独运行 vue-tsc 才能发现组件和共享状态的类型错误。
    name: 前端（Node ${{ matrix.node }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 装依赖
        run: npm ci
        working-directory: web

      # 类型检查要单独跑：vite 构建**不做类型检查**（它只转译），
      # 所以"构建过了"不等于"类型是对的"
      - name: 类型检查
        run: npm run typecheck
        working-directory: web

      - name: 构建产物
        run: npm run build
        working-directory: web

  ui:
    # 先构建后启动独立浏览器，访问的是后端实际托管的前端产物。
    name: 真浏览器
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install websockets   # 驱动浏览器要它（CDP over TCP）

      - name: 构建前端（后端托管的是 web/dist）
        run: npm ci && npm run build
        working-directory: web

      - name: 起一个 headless Chrome（runner 自带）
        run: |
          google-chrome --headless=new --remote-debugging-port=9333 \
            --user-data-dir=/tmp/chrome-profile --no-sandbox --disable-gpu about:blank &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9333/json/version && break
            sleep 1
          done

      - name: 真浏览器验收
        run: python tests/test_ui.py --cdp-port 9333

  scan:
    # 同时检查当前源码与历史路径，避免仅靠 .gitignore 忽略已提交过的私有数据。
    name: 密钥泄漏扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 确认 data/ 从未进入版本库
        run: |
          if git log --all --name-only --pretty=format: | grep -q '^data/'; then
            echo "::error::git 历史里出现了 data/ —— 那里有 API Key 明文"
            exit 1
          fi
          echo "data/ 从未被提交 ✅"

      - name: 确认密钥不会被提交
        run: |
          # 扫出形如 sk-xxxxx 的长串（排除测试里用的假 Key 和文档）
          if git grep -nEI 'sk-[A-Za-z0-9_-]{24,}' -- . ':!tests' ':!*.md' ':!web'; then
            echo "::error::源码里出现疑似真实 API Key"
            exit 1
          fi
          echo "源码里没有真实密钥 ✅"

      - name: 确认 data/ 还在 .gitignore 里（而且是第一条规则）
        run: |
          grep -q '^data/' .gitignore || { echo "::error::data/ 不在 .gitignore 里"; exit 1; }
          # 第一条**规则**（跳过注释和空行）必须就是 data/
          first=$(grep -v '^#' .gitignore | grep -v '^[[:space:]]*$' | head -1)
          [ "$first" = "data/" ] || { echo "::error::data/ 不再是第一条规则（现在第一条是：$first）"; exit 1; }
          echo "data/ 仍然是第一条规则 ✅"
